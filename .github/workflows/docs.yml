name: docs

# Build the Quarto docs site and publish it to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "symeval_mo.py"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one Pages deployment run at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the docs toolchain (quarto-cli, marimo, polars)
        run: uv sync --group docs

      # Regenerate the notebook pages from symeval_mo.py / examples/ so the
      # deployed site always matches source, then render. The getting-started
      # page executes against symeval from PyPI, resolved via each page's
      # dependency header.
      - name: Build the docs site (regenerate pages + render)
        run: uv run task docs_build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
