[project]
name = "symeval"
version = "0.5.1"
description = "Symbolic evaluation for engineering calculations — renders expression → numbers with units → result as LaTeX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = []
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "pint>=0.24"]

[project.urls]
Homepage = "https://github.com/bedrock-engineer/symeval"
Repository = "https://github.com/bedrock-engineer/symeval"
Issues = "https://github.com/bedrock-engineer/symeval/issues"

[dependency-groups]
dev = [
    "marimo>=0.23.14",
    "polars>=1.40.1",
    "pytest>=9.0.3",
    "taskipy>=1.14",
]
# Docs toolchain: quarto-cli is a PyPI wheel bundling the Quarto binary
# (>= 1.9.20 required by the quarto-marimo extension), so the site builds
# through uv with no system-level Quarto install.
docs = [
    "quarto-cli>=1.9.20",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.taskipy.tasks]
# The reasoning behind these tasks (environments, sandbox vs locked env) is
# documented in CONTRIBUTING.md ("Task environments"); the release flow in
# RELEASING.md.
install = "uv sync --all-groups"
# Refresh the locked env before a release; commit uv.lock (see RELEASING.md).
upgrade = "uv sync --upgrade --all-groups"
# Smoke test: execute the whole notebook before mobuild extracts the package.
pre_build = "uv run marimo -y export session --no-sandbox --force-overwrite symeval_mo.py"
build = "uvx --with pint --with sympy --with pytest mobuild export symeval_mo.py src/symeval/__init__.py"
test = "uv run pytest symeval_mo.py"
clean = "bash -c 'rm -rf dist/'"
pre_release = "task build && task test && task docs_readme"
release = """bash -c '\
[ -n "$1" ] || { echo "Usage: uv run task release <version>"; exit 1; } && \
git diff --quiet HEAD || { echo "working tree not clean"; exit 1; } && \
uv version "$1" && \
git commit -m "Release $1" pyproject.toml uv.lock && \
git tag "$1" && \
git push && git push --tags && \
gh release create "$1" --generate-notes\
' --"""
pypi = "task clean && uv build && uv publish"
docs_generate = "uv run scripts/extract_getting_started.py && uv run scripts/examples_to_qmd.py"
docs_preview = "uv run --group docs quarto preview docs/"
docs_render = "uv run --group docs quarto render docs/"
docs_build = "task docs_generate && task docs_render"
# Snapshot executed getting_started outputs (LaTeX) for the README generator.
docs_session = "uv run marimo -y export session --no-sandbox --force-overwrite examples/getting_started.py"
# Not in CI; run locally after changing the docs (see CONTRIBUTING.md).
docs_readme = "task docs_generate && task docs_session && uv run scripts/docs_to_readme.py"
