[project]
name = "symeval"
version = "0.4.0"
description = "Symbolic evaluation for engineering calculations — renders expression → numbers with units → result as LaTeX"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "pint>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/bedrock-engineer/symeval"
Repository = "https://github.com/bedrock-engineer/symeval"
Issues = "https://github.com/bedrock-engineer/symeval/issues"

[dependency-groups]
dev = [
    "marimo>=0.23.14",
    "polars>=1.40.1",
    "pytest>=9.0.3",
    "taskipy>=1.14",
]
# The docs website toolchain. `quarto-cli` is a PyPI wheel that bundles the
# Quarto binary (>= 1.9.20 is required by the quarto-marimo extension), so the
# whole site builds through uv with no system-level Quarto install.
docs = [
    "quarto-cli>=1.9.20",
]

[tool.taskipy.tasks]
# Tasks needing positional args (release) wrap their body in `bash -c '…' --`
# so taskipy's appended args land at $1. Requires `bash` on PATH — present
# wherever git is (Git for Windows ships Git Bash).
install = "uv sync --group dev"
build = "uvx marimo -y export session symeval_mo.py && uvx mobuild export symeval_mo.py src/symeval/__init__.py"
docs_generate = "uv run scripts/extract_getting_started.py && uv run scripts/examples_to_qmd.py"
docs_render = "uv run --group docs quarto render docs/"
docs_build = "task docs_generate && task docs_render"
docs_preview = "uv run --group docs quarto preview docs/"
test = "uvx --with sympy --with pint --with marimo --with polars pytest symeval_mo.py"
clean = "bash -c 'rm -rf dist/'"
pre_release = "task build && task test"
release = """bash -c '\
[ -n "$1" ] || { echo "Usage: uv run task release <version>"; exit 1; } && \
git diff --quiet HEAD || { echo "working tree not clean"; exit 1; } && \
uv version "$1" && \
git commit -m "Release $1" pyproject.toml uv.lock && \
git tag "$1" && \
git push && git push --tags && \
gh release create "$1" --generate-notes\
' --"""
pypi = "task clean && uv build && uv publish"
